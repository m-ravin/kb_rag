# Local development stack — runs backend, frontend, and Redis together.
# Azure services (OpenAI, Search, Cosmos) still connect to real Azure endpoints
# via your .env file. Only Redis runs locally in this compose setup.

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - REDIS_CONNECTION=redis://:@redis:6379
      - DEBUG=true
    depends_on:
      - redis
    volumes:
      - ./backend:/app/backend  # Hot-reload in development
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru

volumes:
  redis_data:
