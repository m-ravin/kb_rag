name: E2E Tests (Playwright)

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    permissions:
      contents: read
      pull-requests: write

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium firefox

      - name: Build frontend
        run: npm run build

      - name: Start preview server
        run: npm run preview &
        env:
          # Point proxy at a mock backend (no real Azure needed)
          VITE_API_BASE_URL: ""

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:4173 --timeout 30000

      - name: Run Playwright tests
        run: npx playwright test
        env:
          BASE_URL: http://localhost:4173
          CI: true

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14

      - name: Upload test artifacts (screenshots / videos)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts
          path: |
            frontend/artifacts/
            frontend/test-results/
          retention-days: 7

      - name: Post E2E summary to PR
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## 🎭 E2E Test Results\n\n';
            try {
              const results = JSON.parse(fs.readFileSync('frontend/playwright-results.json', 'utf8'));
              const { suites } = results;
              let passed = 0, failed = 0, skipped = 0;
              const failures = [];

              function walk(suite) {
                for (const s of suite.suites || []) walk(s);
                for (const spec of suite.specs || []) {
                  for (const test of spec.tests || []) {
                    const status = test.results?.[0]?.status;
                    if (status === 'passed') passed++;
                    else if (status === 'skipped') skipped++;
                    else { failed++; failures.push(`- \`${spec.title}\``); }
                  }
                }
              }
              for (const s of suites || []) walk(s);

              const icon = failed === 0 ? '✅' : '❌';
              body += `${icon} **${passed} passed** | ${failed} failed | ${skipped} skipped\n\n`;
              if (failures.length > 0) {
                body += `### Failed Tests\n${failures.slice(0, 10).join('\n')}\n`;
                if (failures.length > 10) body += `...and ${failures.length - 10} more\n`;
              }
              body += `\n📄 [Download HTML Report](${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID})`;
            } catch (e) {
              body += `> Could not parse results: ${e.message}`;
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
