name: Build and Deploy to Container Apps

# Manual trigger only — deployment requires explicit human confirmation.
# Go to: Actions → "Build and Deploy to Container Apps" → "Run workflow"
# CI (tests, lint, E2E) still runs automatically on every pull request.
on:
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  RESOURCE_GROUP: ${{ secrets.ACA_RESOURCE_GROUP }}
  KEY_VAULT_URI: ${{ secrets.KEY_VAULT_URI }}
  ACA_IDENTITY_ID: ${{ secrets.ACA_IDENTITY_ID }}
  BACKEND_APP_NAME: ${{ secrets.ACA_BACKEND_APP_NAME }}
  FRONTEND_APP_NAME: ${{ secrets.ACA_FRONTEND_APP_NAME }}
  PRESIDIO_APP_NAME: ${{ secrets.ACA_PRESIDIO_APP_NAME }}

jobs:
  # ── Job 1: Build Docker images and push to ACR ────────────────────────────────
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag from Git SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache,mode=max

      - name: Build and push presidio-service image
        uses: docker/build-push-action@v5
        with:
          context: ./presidio-service
          file: ./presidio-service/Dockerfile
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-presidio:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-presidio:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-presidio:cache,mode=max

  # ── Job 2: Point each app's secrets at Key Vault (idempotent) ────────────────
  # Container Apps reads secrets directly from Key Vault at runtime via the
  # shared managed identity — values never pass through this workflow or its logs.
  configure-secrets:
    name: Configure Key Vault secret references
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Point backend secrets at Key Vault
        run: |
          kv_ref() { echo "$1=keyvaultref:${{ env.KEY_VAULT_URI }}secrets/$2,identityref:${{ env.ACA_IDENTITY_ID }}"; }

          az containerapp secret set \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --secrets \
              "$(kv_ref openai-key openai-api-key)" \
              "$(kv_ref openai-endpoint openai-endpoint)" \
              "$(kv_ref content-safety-key content-safety-key)" \
              "$(kv_ref content-safety-endpoint content-safety-endpoint)" \
              "$(kv_ref search-key search-api-key)" \
              "$(kv_ref search-endpoint search-endpoint)" \
              "$(kv_ref cosmos-mongo-connection cosmos-mongo-connection-string)" \
              "$(kv_ref cosmos-gremlin-endpoint cosmos-gremlin-endpoint)" \
              "$(kv_ref cosmos-gremlin-key cosmos-gremlin-key)" \
              "$(kv_ref redis-connection redis-connection-string)" \
              "$(kv_ref storage-connection storage-connection-string)" \
              "$(kv_ref appinsights-connection appinsights-connection-string)"

          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --set-env-vars \
              AZURE_OPENAI_KEY=secretref:openai-key \
              AZURE_OPENAI_ENDPOINT=secretref:openai-endpoint \
              CONTENT_SAFETY_KEY=secretref:content-safety-key \
              CONTENT_SAFETY_ENDPOINT=secretref:content-safety-endpoint \
              AZURE_SEARCH_KEY=secretref:search-key \
              AZURE_SEARCH_ENDPOINT=secretref:search-endpoint \
              COSMOS_MONGO_CONNECTION=secretref:cosmos-mongo-connection \
              COSMOS_GREMLIN_ENDPOINT=secretref:cosmos-gremlin-endpoint \
              COSMOS_GREMLIN_KEY=secretref:cosmos-gremlin-key \
              REDIS_CONNECTION=secretref:redis-connection \
              STORAGE_CONNECTION=secretref:storage-connection \
              APPINSIGHTS_CONNECTION_STRING=secretref:appinsights-connection

  # ── Job 3: Deploy new images ──────────────────────────────────────────────────
  deploy:
    name: Deploy new images to Container Apps
    runs-on: ubuntu-latest
    needs: [build, configure-secrets]
    environment: production

    steps:
      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy presidio-service
        run: |
          az containerapp update \
            --name "${{ env.PRESIDIO_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/kb-rag-presidio:${{ needs.build.outputs.image_tag }}"

      - name: Deploy backend
        run: |
          az containerapp update \
            --name "${{ env.BACKEND_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:${{ needs.build.outputs.image_tag }}"

      - name: Deploy frontend
        run: |
          az containerapp update \
            --name "${{ env.FRONTEND_APP_NAME }}" \
            --resource-group "${{ env.RESOURCE_GROUP }}" \
            --image "${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:${{ needs.build.outputs.image_tag }}"

      - name: Print revision status
        if: always()
        run: |
          for app in "${{ env.PRESIDIO_APP_NAME }}" "${{ env.BACKEND_APP_NAME }}" "${{ env.FRONTEND_APP_NAME }}"; do
            echo "--- $app ---"
            az containerapp revision list \
              --name "$app" \
              --resource-group "${{ env.RESOURCE_GROUP }}" \
              --query "[0].{name:name, active:properties.active, healthState:properties.healthState, replicas:properties.replicas}" \
              -o table
          done
