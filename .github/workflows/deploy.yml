name: Build and Deploy to AKS

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}

jobs:
  # ── Build and push Docker images to Azure Container Registry ─────────────
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag from Git SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache,mode=max

  # ── Deploy to AKS ─────────────────────────────────────────────────────────
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group ${{ env.AKS_RESOURCE_GROUP }} \
            --name ${{ env.AKS_CLUSTER_NAME }} \
            --overwrite-existing

      - name: Apply Kubernetes namespace and config
        run: kubectl apply -f infrastructure/kubernetes/namespace-and-config.yaml

      - name: Deploy backend (rolling update)
        run: |
          sed -i "s|REGISTRY_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" \
            infrastructure/kubernetes/backend-deployment.yaml
          sed -i "s|IMAGE_TAG|${{ needs.build.outputs.image_tag }}|g" \
            infrastructure/kubernetes/backend-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/backend-deployment.yaml

      - name: Deploy frontend (rolling update)
        run: |
          sed -i "s|REGISTRY_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" \
            infrastructure/kubernetes/frontend-deployment.yaml
          sed -i "s|IMAGE_TAG|${{ needs.build.outputs.image_tag }}|g" \
            infrastructure/kubernetes/frontend-deployment.yaml
          kubectl apply -f infrastructure/kubernetes/frontend-deployment.yaml

      - name: Apply ingress
        run: kubectl apply -f infrastructure/kubernetes/ingress.yaml

      - name: Verify rollout
        run: |
          kubectl rollout status deployment/kb-rag-backend -n kb-rag --timeout=120s
          kubectl rollout status deployment/kb-rag-frontend -n kb-rag --timeout=120s
