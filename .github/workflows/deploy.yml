name: Build and Deploy to AKS

# Manual trigger only — deployment requires explicit human confirmation.
# Go to: Actions → "Build and Deploy to AKS" → "Run workflow"
# CI (tests, lint, E2E) still runs automatically on every pull request.
on:
  workflow_dispatch:

env:
  ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
  AKS_CLUSTER_NAME: ${{ secrets.AKS_CLUSTER_NAME }}
  AKS_RESOURCE_GROUP: ${{ secrets.AKS_RESOURCE_GROUP }}
  KEY_VAULT_URI: ${{ secrets.KEY_VAULT_URI }}

jobs:
  # ── Job 1: Sync Key Vault secrets → Kubernetes Secret ────────────────────────
  # Runs BEFORE the deploy job so pods always have fresh credentials.
  # No secret values ever appear in logs — az keyvault secret show pipes
  # directly into kubectl, and all values are masked by Azure CLI.
  sync-secrets:
    name: Sync Key Vault → K8s Secrets
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ env.AKS_RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Apply namespace and ConfigMap
        run: kubectl apply -f infrastructure/kubernetes/namespace-and-config.yaml

      # Pull each secret from Key Vault and create/update a Kubernetes Secret.
      # kubectl create secret --dry-run=client | kubectl apply pipes the manifest
      # through stdin so values never touch the filesystem.
      - name: Create/update kb-rag-secrets Kubernetes Secret from Key Vault
        env:
          KV_NAME: ${{ env.KEY_VAULT_URI }}
        run: |
          KV=$(echo "$KV_NAME" | sed 's|https://||;s|.vault.azure.net/||')

          fetch() { az keyvault secret show --vault-name "$KV" --name "$1" --query value -o tsv; }

          kubectl create secret generic kb-rag-secrets \
            --namespace kb-rag \
            --from-literal=AZURE_OPENAI_KEY="$(fetch openai-api-key)" \
            --from-literal=AZURE_OPENAI_ENDPOINT="$(fetch openai-endpoint)" \
            --from-literal=AZURE_SEARCH_KEY="$(fetch search-api-key)" \
            --from-literal=AZURE_SEARCH_ENDPOINT="$(fetch search-endpoint)" \
            --from-literal=COSMOS_MONGO_CONNECTION="$(fetch cosmos-mongo-connection-string)" \
            --from-literal=COSMOS_GREMLIN_ENDPOINT="$(fetch cosmos-gremlin-endpoint)" \
            --from-literal=COSMOS_GREMLIN_KEY="$(fetch cosmos-gremlin-key)" \
            --from-literal=REDIS_CONNECTION="$(fetch redis-connection-string)" \
            --from-literal=STORAGE_CONNECTION="$(fetch storage-connection-string)" \
            --from-literal=APPINSIGHTS_CONNECTION_STRING="$(fetch appinsights-connection-string)" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "kb-rag-secrets synced from Key Vault: $KV"

      # Apply SecretProviderClass so the CSI driver also mounts secrets as files
      # (needed by any pod that uses volumeMounts for Key Vault access)
      - name: Apply SecretProviderClass
        run: |
          if [ -f infrastructure/kubernetes/secret-provider-class.yaml ]; then
            kubectl apply -f infrastructure/kubernetes/secret-provider-class.yaml
          else
            echo "secret-provider-class.yaml not found — skipping (run terraform apply first)"
          fi

  # ── Job 2: Build Docker images and push to ACR ────────────────────────────────
  # Runs in parallel with sync-secrets (no dependency between them).
  build:
    name: Build and Push Docker Images
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate image tag from Git SHA
        id: tag
        run: echo "tag=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.backend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-backend:cache,mode=max

      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.frontend
          push: true
          tags: ${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:${{ steps.tag.outputs.tag }}
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/kb-rag-frontend:cache,mode=max

  # ── Job 3: Deploy to AKS ──────────────────────────────────────────────────────
  # Waits for BOTH sync-secrets and build to complete before deploying.
  deploy:
    name: Deploy to AKS
    runs-on: ubuntu-latest
    needs: [sync-secrets, build]
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Get AKS credentials
        run: |
          az aks get-credentials \
            --resource-group "${{ env.AKS_RESOURCE_GROUP }}" \
            --name "${{ env.AKS_CLUSTER_NAME }}" \
            --overwrite-existing

      - name: Deploy backend (rolling update)
        run: |
          sed \
            -e "s|REGISTRY_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" \
            -e "s|IMAGE_TAG|${{ needs.build.outputs.image_tag }}|g" \
            infrastructure/kubernetes/backend-deployment.yaml | kubectl apply -f -

      - name: Deploy frontend (rolling update)
        run: |
          sed \
            -e "s|REGISTRY_LOGIN_SERVER|${{ env.ACR_LOGIN_SERVER }}|g" \
            -e "s|IMAGE_TAG|${{ needs.build.outputs.image_tag }}|g" \
            infrastructure/kubernetes/frontend-deployment.yaml | kubectl apply -f -

      - name: Apply ingress
        run: kubectl apply -f infrastructure/kubernetes/ingress.yaml

      - name: Wait for rollout
        run: |
          kubectl rollout status deployment/kb-rag-backend  -n kb-rag --timeout=180s
          kubectl rollout status deployment/kb-rag-frontend -n kb-rag --timeout=180s

      - name: Print pod status
        if: always()
        run: kubectl get pods -n kb-rag -o wide
