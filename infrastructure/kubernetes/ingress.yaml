apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kb-rag-ingress
  namespace: kb-rag
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  rules:
    - host: kb-rag.example.com    # Replace with your domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kb-rag-backend
                port:
                  number: 80
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kb-rag-frontend
                port:
                  number: 80
