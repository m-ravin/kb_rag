apiVersion: apps/v1
kind: Deployment
metadata:
  name: kb-rag-frontend
  namespace: kb-rag
  labels:
    app: kb-rag-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: kb-rag-frontend
  template:
    metadata:
      labels:
        app: kb-rag-frontend
    spec:
      containers:
        - name: frontend
          image: REGISTRY_LOGIN_SERVER/kb-rag-frontend:IMAGE_TAG
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "64Mi"
              cpu: "50m"
            limits:
              memory: "128Mi"
              cpu: "200m"
---
apiVersion: v1
kind: Service
metadata:
  name: kb-rag-frontend
  namespace: kb-rag
spec:
  selector:
    app: kb-rag-frontend
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
