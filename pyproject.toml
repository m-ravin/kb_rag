[project]
name = "kb_rag"
version = "1.0.0"
description = "KB RAG — General-purpose knowledge base RAG system on Azure"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────────
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.6",
    "python-multipart>=0.0.9",

    # ── Azure SDK ──────────────────────────────────────────────────────────────
    "azure-search-documents>=11.6.0b4",
    "azure-storage-blob>=12.22.0",
    "azure-identity>=1.17.1",

    # ── OpenAI / Azure OpenAI ──────────────────────────────────────────────────
    "openai>=1.40.0",

    # ── Database drivers ───────────────────────────────────────────────────────
    "motor>=3.5.0",          # Async MongoDB (Cosmos MongoDB API)
    "pymongo>=4.8.0",
    "gremlinpython>=3.7.1",  # Cosmos Gremlin API

    # ── Caching ────────────────────────────────────────────────────────────────
    "redis[hiredis]>=5.0.8",

    # ── Document parsing ───────────────────────────────────────────────────────
    "pymupdf>=1.24.5",       # PDF
    "python-docx>=1.1.2",    # DOCX
    "python-pptx>=0.6.23",   # PPTX

    # ── Auth ───────────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── Config ─────────────────────────────────────────────────────────────────
    "pydantic-settings>=2.4.0",

    # ── HTTP client ────────────────────────────────────────────────────────────
    "httpx>=0.27.0",

    # ── Validation helpers ─────────────────────────────────────────────────────
    "email-validator>=2.1.0",   # enables pydantic EmailStr

    # ── Rate limiting ──────────────────────────────────────────────────────────
    "slowapi>=0.1.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.2",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "anyio>=4.4.0",
    "ruff>=0.6.0",
    "mypy>=1.11.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# Tell hatchling the importable Python package lives in backend/
packages = ["backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--tb=short -q"

[tool.coverage.run]
source = ["backend"]
omit = ["tests/*", "*/__init__.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
